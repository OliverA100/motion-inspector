<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>Showcase · Motion Inspector</title>
    <!-- A small page with motion worth inspecting, filmed for the README by
         tests/demo-video.cjs: cards that fly in as the page loads, a card that
         lifts on hover, a like button and a switch that answer a click. -->
    <style>
      :root {
        --bg: #f3f1ee;
        --surface: #ffffff;
        --ink: #1d1b19;
        --muted: #8a847d;
        --line: #e6e1db;
        --accent: #ff5a36;
        --accent-2: #6d5dfc;
        --green: #19b36b;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        font:
          15px/1.4 system-ui,
          sans-serif;
        color: var(--ink);
        background: var(--bg);
      }
      header {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 18px 32px;
        font-weight: 650;
      }
      .logo {
        width: 22px;
        height: 22px;
        border-radius: 7px;
        background: linear-gradient(135deg, var(--accent), var(--accent-2));
      }
      main {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 28px;
        padding: 8px 32px 32px;
      }
      h2 {
        margin: 0 0 12px;
        font-size: 13px;
        font-weight: 600;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.06em;
      }

      /* Load: three notifications fly in, one after another. */
      .stack {
        display: grid;
        gap: 12px;
      }
      .note {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 14px 16px;
        border-radius: 14px;
        background: var(--surface);
        box-shadow: 0 1px 2px rgb(0 0 0 / 6%);
        animation: fly-in 900ms cubic-bezier(0.16, 1, 0.3, 1) both;
        animation-delay: calc(var(--i) * 140ms + 150ms);
      }
      .note__dot {
        flex: none;
        width: 34px;
        height: 34px;
        border-radius: 50%;
        background: var(--c);
      }
      .note small {
        display: block;
        color: var(--muted);
      }
      @keyframes fly-in {
        from {
          opacity: 0;
          transform: translateY(48px) rotate(-4deg) scale(0.92);
        }
      }

      /* Hover: the card lifts, tilts and its picture grows. */
      .plan {
        position: relative;
        padding: 18px;
        border-radius: 18px;
        background: var(--surface);
        box-shadow: 0 1px 2px rgb(0 0 0 / 6%);
        transition:
          transform 450ms cubic-bezier(0.34, 1.56, 0.64, 1),
          box-shadow 450ms ease;
      }
      .plan:hover {
        transform: translateY(-12px) rotate(-1.5deg) scale(1.03);
        box-shadow: 0 24px 40px -12px rgb(60 40 20 / 30%);
      }
      .plan__picture {
        height: 96px;
        border-radius: 12px;
        background: linear-gradient(120deg, var(--accent), var(--accent-2));
        transition: transform 600ms cubic-bezier(0.2, 0.8, 0.2, 1);
      }
      .plan:hover .plan__picture {
        transform: scale(1.06);
      }
      .plan p {
        margin: 12px 0 0;
        font-weight: 600;
      }

      /* Click: the heart pops and a ring bursts from it. */
      .controls {
        display: flex;
        align-items: center;
        gap: 24px;
        margin-top: 28px;
      }
      .like {
        position: relative;
        width: 64px;
        height: 64px;
        border: 0;
        border-radius: 50%;
        background: var(--surface);
        box-shadow: 0 1px 2px rgb(0 0 0 / 8%);
        cursor: pointer;
      }
      .like__heart {
        position: absolute;
        inset: 20px;
        border-radius: 6px;
        background: #cfc8c0;
        transform: rotate(45deg);
        transition: background-color 200ms;
      }
      .like::after {
        content: '';
        position: absolute;
        inset: 0;
        border-radius: 50%;
        border: 3px solid var(--accent);
        opacity: 0;
      }
      .like.on .like__heart {
        background: var(--accent);
        animation: pop 650ms cubic-bezier(0.3, 0, 0.2, 1);
      }
      .like.on::after {
        animation: ring 650ms ease-out;
      }
      @keyframes pop {
        0% {
          transform: rotate(45deg) scale(1);
        }
        30% {
          transform: rotate(45deg) scale(1.45);
        }
        55% {
          transform: rotate(45deg) scale(0.85);
        }
        75% {
          transform: rotate(45deg) scale(1.1);
        }
        100% {
          transform: rotate(45deg) scale(1);
        }
      }
      @keyframes ring {
        from {
          opacity: 1;
          transform: scale(0.6);
        }
        to {
          opacity: 0;
          transform: scale(1.6);
        }
      }

      /* Click: the switch slides on a spring. */
      .switch {
        position: relative;
        width: 76px;
        height: 40px;
        border: 0;
        border-radius: 20px;
        background: #d6d0c9;
        cursor: pointer;
        transition: background-color 300ms;
      }
      .switch::before {
        content: '';
        position: absolute;
        top: 4px;
        left: 4px;
        width: 32px;
        height: 32px;
        border-radius: 50%;
        background: #fff;
        box-shadow: 0 2px 4px rgb(0 0 0 / 20%);
        transition: transform 700ms
          linear(0, 0.25 8%, 0.76 20%, 1.09 32%, 1.18 39%, 1.13 48%, 1 60%, 0.96 70%, 1);
      }
      .switch.on {
        background: var(--green);
      }
      .switch.on::before {
        transform: translateX(36px);
      }
    </style>
  </head>
  <body>
    <header><span class="logo"></span>Acme</header>
    <main>
      <section>
        <h2>Inbox</h2>
        <div class="stack">
          <div class="note" style="--i: 0; --c: var(--accent)">
            <span class="note__dot"></span>
            <div>Your order shipped<small>Arrives on Thursday</small></div>
          </div>
          <div class="note" style="--i: 1; --c: var(--accent-2)">
            <span class="note__dot"></span>
            <div>New comment<small>Looks great, ship it</small></div>
          </div>
          <div class="note" style="--i: 2; --c: var(--green)">
            <span class="note__dot"></span>
            <div>Payment received<small>Invoice 1042 is paid</small></div>
          </div>
        </div>
      </section>
      <section>
        <h2>Featured</h2>
        <div class="plan">
          <div class="plan__picture"></div>
          <p>Summer collection</p>
        </div>
        <div class="controls">
          <button class="like" type="button" aria-label="Like">
            <span class="like__heart"></span>
          </button>
          <button class="switch" type="button" aria-label="Notifications"></button>
        </div>
      </section>
    </main>
    <script>
      for (const button of document.querySelectorAll('.like, .switch')) {
        button.addEventListener('click', () => button.classList.toggle('on'));
      }
    </script>
  </body>
</html>
